<style id="artmarks-dark-mode">
/* ===== Dark mode (neutral gray) ===== */
:root{color-scheme:dark}
html,body{background:#121212 !important;color:#e8e8e8 !important}
#root{background:transparent}

/* surfaces */
.bg-white{background-color:#1e1e1e !important}
.bg-gray-50{background-color:#181818 !important}
.bg-brand-pale,.hover\:bg-brand-pale:hover{background-color:#2a2a2a !important}
.bg-brand,.hover\:bg-brand:hover{background-color:#3d3d3d !important}
.hover\:bg-brand-dark:hover{background-color:#4a4a4a !important}
.bg-brand\/15{background-color:rgba(255,255,255,.07) !important}
.bg-gray-400{background-color:#3a3a3a !important}
.bg-red-50{background-color:#2a1a1a !important}
.bg-yellow-50{background-color:#2a2519 !important}

/* keep the QR box light so the code stays scannable */
.bg-white.w-fit{background-color:#ffffff !important;border-color:#3d3d3d !important}

/* text */
.text-black{color:#f2f2f2 !important}
.text-white,.hover\:text-white:hover{color:#ffffff !important}
.text-brand{color:#d4d4d4 !important}
.text-brand-dark,.hover\:text-brand-dark:hover{color:#f2f2f2 !important}
.text-brand\/70{color:rgba(212,212,212,.72) !important}
.text-gray-700{color:#d0d0d0 !important}
.text-gray-600{color:#bdbdbd !important}
.text-gray-500{color:#a0a0a0 !important}
.text-gray-400{color:#8a8a8a !important}
.text-gray-300{color:#757575 !important}
.text-red-500,.text-red-600{color:#ff9494 !important}
.text-yellow-500,.text-yellow-600{color:#e0c56a !important}

/* borders */
.border-gray-100{border-color:#2a2a2a !important}
.border-gray-200{border-color:#333333 !important}
.border-yellow-200{border-color:#4d452a !important}
.border-brand,.focus\:border-brand:focus{border-color:#5a5a5a !important}
.border-brand\/15{border-color:rgba(255,255,255,.10) !important}
.border-brand\/20{border-color:rgba(255,255,255,.14) !important}
.border-brand\/30{border-color:rgba(255,255,255,.20) !important}
