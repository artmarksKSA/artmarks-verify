<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARTMARKS - التحقق من الشهادات</title>
    
    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --primary-dark-green: #0c4b3b;
        --secondary-petroleum: #005F6A;
        --accent-beige: #dec482;
        --bg-cream: #F5F2E9;
        --text-dark: #1f2937;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Noto Sans Arabic', 'Tajawal', sans-serif;
        background-color: var(--bg-cream);
        color: var(--text-dark);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background-color: var(--primary-dark-green);
        padding: 1rem 2rem;
        border-bottom: 3px solid var(--accent-beige);
      }

      .header-container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand-wrapper {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
      }

      /* إصلاح عرض وحجم الشعار */
      .brand-logo-img {
        height: 45px;
        width: auto;
        max-width: 180px;
        object-fit: contain;
        display: block;
      }

      .brand-name-text {
        color: var(--accent-beige);
        font-size: 1.4rem;
        font-weight: 700;
        font-family: 'Tajawal', sans-serif;
      }

      nav ul {
        display: flex;
        list-style: none;
        gap: 1.5rem;
      }

      nav a {
        color: #ffffff;
        text-decoration: none;
        font-size: 0.95rem;
        transition: color 0.3s ease;
      }

      nav a:hover {
        color: var(--accent-beige);
      }

      main {
        flex: 1;
        max-width: 800px;
        width: 100%;
        margin: 3rem auto;
        padding: 0 1.5rem;
      }

      .card-container {
        background: #ffffff;
        border-radius: 12px;
        padding: 2.5rem;
        box-shadow: 0 10px 25px rgba(12, 75, 59, 0.08);
        border: 1px solid rgba(222, 196, 130, 0.3);
      }

      .card-title {
        color: var(--primary-dark-green);
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
        text-align: center;
      }

      .card-subtitle {
        color: var(--secondary-petroleum);
        text-align: center;
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }

      .search-form {
        display: flex;
        gap: 0.5rem;
      }

      .search-form input {
        flex: 1;
        padding: 0.85rem 1.2rem;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.3s ease;
      }

      .search-form input:focus {
        border-color: var(--secondary-petroleum);
      }

      .search-form button {
        background-color: var(--primary-dark-green);
        color: #ffffff;
        border: none;
        padding: 0.85rem 1.8rem;
        border-radius: 8px;
        font-family: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .search-form button:hover {
        background-color: var(--secondary-petroleum);
      }

      footer {
        background-color: var(--primary-dark-green);
        color: #ffffff;
        text-align: center;
        padding: 1.5rem;
        margin-top: auto;
        font-size: 0.85rem;
        border-top: 1px solid var(--accent-beige);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-container">
        <a href="#" class="brand-wrapper">
          <!-- الشعار: يمكنك استبدال الرابط أدناه بمسار الشعار الخاص بك محلياً أو على الخادم -->
          <img 
            src="logo.png" 
            alt="ARTMARKS Logo" 
            class="brand-logo-img"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';"
          />
          <span class="brand-name-text">بصمات فن | ARTMARKS</span>
        </a>
        <nav>
          <ul>
            <li><a href="#">الرئيسية</a></li>
            <li><a href="#">التحقق من الشهادات</a></li>
            <li><a href="#">المعرض</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <div class="card-container">
        <h1 class="card-title">التحقق من أصالة العمل الفني</h1>
        <p class="card-subtitle">أدخل رقم الشهادة أو معرّف التوثيق للتحقق من بيانات الملكية</p>
        
        <form class="search-form" onsubmit="event.preventDefault();">
          <input type="text" placeholder="أدخل معرّف الشهادة هنا..." required />
          <button type="submit">تحقق الآن</button>
        </form>
      </div>
    </main>

    <footer>
      <p>© 2026 جميع الحقوق محفوظة لـ منصة بصمات فن (ARTMARKS)</p>
    </footer>
  </body>
</html>
