<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARTMARKS - التحقق من الشهادات على البلوكتشين</title>
    
    <!-- الخطوط الرسمية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --primary-dark-green: #0c4b3b;
        --secondary-petroleum: #005F6A;
        --accent-beige: #dec482;
        --bg-cream: #F5F2E9;
        --text-dark: #1f2937;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Noto Sans Arabic', 'Tajawal', sans-serif;
        background-color: var(--bg-cream);
        color: var(--text-dark);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background-color: var(--primary-dark-green);
        padding: 1.5rem 2rem;
        border-bottom: 3px solid var(--accent-beige);
      }

      .header-container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo-brand {
        display: flex;
        align-items: center;
        gap: 1rem;
        text-decoration: none;
      }

      /* الشعار الرسمي أولاً */
      .brand-logo {
        height: 50px;
        width: auto;
        object-fit: contain;
      }

      .brand-title {
        color: var(--accent-beige);
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .nav-links {
        display: flex;
        gap: 1.5rem;
      }

      .nav-links a {
        color: #ffffff;
        text-decoration: none;
        font-size: 0.95rem;
        transition: color 0.3s ease;
      }

      .nav-links a:hover {
        color: var(--accent-beige);
      }

      main {
        flex: 1;
        max-width: 900px;
        width: 100%;
        margin: 3rem auto;
        padding: 0 1.5rem;
      }

      .verification-card {
        background: #ffffff;
        border-radius: 12px;
        padding: 2.5rem;
        box-shadow: 0 10px 25px rgba(12, 75, 59, 0.08);
        border: 1px solid rgba(222, 196, 130, 0.3);
      }

      .card-title {
        color: var(--primary-dark-green);
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
        text-align: center;
      }

      .card-subtitle {
        color: var(--secondary-petroleum);
        text-align: center;
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }

      .search-box {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 2rem;
      }

      .search-input {
        flex: 1;
        padding: 0.85rem 1.2rem;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.3s ease;
      }

      .search-input:focus {
        border-color: var(--secondary-petroleum);
      }

      .btn-primary {
        background-color: var(--primary-dark-green);
        color: #ffffff;
        border: none;
        padding: 0.85rem 1.8rem;
        border-radius: 8px;
        font-family: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .btn-primary:hover {
        background-color: var(--secondary-petroleum);
      }

      footer {
        background-color: var(--primary-dark-green);
        color: #ffffff;
        text-align: center;
        padding: 1.5rem;
        margin-top: auto;
        font-size: 0.85rem;
        border-top: 1px solid var(--accent-beige);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-container">
        <a href="#" class="logo-brand">
          <img src="https://raw.githubusercontent.com/artmarksKSA/assets/main/logo.png" alt="بصمات فن ARTMARKS" class="brand-logo" />
          <span class="brand-title">بصمات فن | ARTMARKS</span>
        </a>
        <nav class="nav-links">
          <a href="#">الرئيسية</a>
          <a href="#">التحقق من الشهادات</a>
          <a href="#">المعرض</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="verification-card">
        <h1 class="card-title">التحقق من أصالة العمل الفني</h1>
        <p class="card-subtitle">أدخل معرّف الشهادة أو الهاش الخاص بالبلوكتشين للتحقق من ملكية وثيقة الاستحواذ</p>
        
        <div class="search-box">
          <input type="text" class="search-input" placeholder="أدخل معرف الشهادة (e.g., 0x71C... or Certificate ID)" />
          <button class="btn-primary">تحقق الآن</button>
        </div>
      </div>
    </main>

    <footer>
      <p>© 2026 جميع الحقوق محفوظة لـ منصة بصمات فن (ARTMARKS)</p>
    </footer>
  </body>
</html>
